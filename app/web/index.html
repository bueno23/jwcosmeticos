<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>JW Cosméticos Multimarcas — Controle de Estoque</title>
  <link rel="stylesheet" href="/estilo.css" />
</head>
<body>
  <div class="app">
    <nav class="menu">
      <div class="marca-lateral">
        <img
          src="/logo.png" alt="JW Cosméticos Multimarcas" class="logo-lateral"
          onerror="this.hidden=true; document.getElementById('marca-texto-lateral').hidden=false;"
        />
        <div id="marca-texto-lateral" class="marca-texto-lateral" hidden>
          <span class="marca-preto">JW COSMÉTICOS</span>
          <span class="marca-dourado">MULTIMARCAS</span>
        </div>
      </div>
      <div class="menu-subtitulo">Controle de Estoque</div>
      <button class="menu-item" data-tela="dashboard">Dashboard</button>
      <button class="menu-item" data-tela="produtos">Produtos</button>
      <button class="menu-item" data-tela="movimentacoes">Movimentações</button>
      <button class="menu-item" data-tela="relatorios">Relatórios</button>
    </nav>
    <div class="corpo">
      <header class="topo-marca">
        <div class="topo-marca-nome">
          <span class="marca-preto">JW Cosméticos</span>
          <span class="marca-dourado">Multimarcas</span>
        </div>
      </header>
      <main id="conteudo" class="conteudo"></main>
    </div>
  </div>

  <div id="modal-fundo" class="modal-fundo oculto">
    <div id="modal-caixa" class="modal-caixa"></div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
